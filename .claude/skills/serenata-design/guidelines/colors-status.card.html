<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}.pill{display:inline-flex;min-width:80px;justify-content:center;height:22px;align-items:center;padding:0 10px;border-radius:var(--radius-pill);font-size:var(--text-eyebrow);font-weight:var(--weight-semibold)}</style></head><body>
<div style="display:flex;gap:22px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="pill" style="background:var(--sn-status-approved-bg);color:var(--sn-status-approved-fg)">Aprobada</span><span style="font-size:10px;color:var(--text-faint)">#218C3E on tint</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="pill" style="background:var(--sn-status-issued-bg);color:var(--sn-status-issued-fg)">Emitida</span><span style="font-size:10px;color:var(--text-faint)">#1C63B7 on tint</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="pill" style="background:var(--sn-status-draft-bg);color:var(--sn-status-draft-fg)">Borrador</span><span style="font-size:10px;color:var(--text-faint)">#6E6E73 on tint</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="pill" style="background:var(--sn-status-cancelled-bg);color:var(--sn-status-cancelled-fg)">Cancelada</span><span style="font-size:10px;color:var(--text-faint)">#C13A20 on tint</span></div>
</div>
</body></html>
