<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Light shell (default): page, sidebar/topbar glass, card, row alt" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}.sw{flex:1;min-width:0}.bx{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.lb{margin-top:8px;font-size:11px;color:var(--text-body);font-weight:600}.hx{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:flex;gap:10px">
<div class="sw"><div class="bx" style="background:var(--bg-app)"></div><div class="lb">bg-app</div><div class="hx">#F5F5F7</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-sidebar);backdrop-filter:var(--blur-strong)"></div><div class="lb">surface-sidebar</div><div class="hx">glass · rgba(237,237,240,.78)</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-topbar);backdrop-filter:var(--blur-soft)"></div><div class="lb">surface-topbar</div><div class="hx">glass · rgba(245,245,247,.72)</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-card)"></div><div class="lb">surface-card</div><div class="hx">#FFFFFF</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-row)"></div><div class="lb">surface-row</div><div class="hx">#FAFAFB</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-input)"></div><div class="lb">surface-input</div><div class="hx">rgba(120,120,128,.12)</div></div>
</div>
<div data-theme="dark" style="display:flex;gap:10px;margin-top:14px;padding:12px;border-radius:var(--radius-lg);background:var(--bg-app)">
<div class="sw"><div class="bx" style="background:var(--bg-app)"></div><div class="lb">dark · bg-app</div><div class="hx">#1C1C1E</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-card)"></div><div class="lb">dark · surface-card</div><div class="hx">#2C2C2E</div></div>
<div class="sw"><div class="bx" style="background:var(--surface-row)"></div><div class="lb">dark · surface-row</div><div class="hx">#262628</div></div>
</div>
</body></html>
