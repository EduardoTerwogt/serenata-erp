<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Inputs 9, buttons/nav 8, cards 12, badges pill" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}</style></head><body>
<div style="display:flex;gap:14px;align-items:center">
<div style="width:110px;height:80px;border-radius:var(--radius-sm);background:var(--surface-row);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">sm 7px</div>
<div style="width:110px;height:80px;border-radius:var(--radius-md);background:var(--surface-row);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">md 8px</div>
<div style="width:110px;height:80px;border-radius:var(--radius-input);background:var(--surface-row);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">input 9px</div>
<div style="width:110px;height:80px;border-radius:var(--radius-lg);background:var(--surface-row);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">lg 12px</div>
<div style="height:34px;padding:0 18px;border-radius:var(--radius-pill);background:var(--surface-row);border:1px solid var(--border-subtle);display:flex;align-items:center;font-size:11px;color:var(--text-muted)">pill 999px</div>
<div style="width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--sn-orange-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">MR</div>
</div></body></html>
