<!-- @dsCard group="Brand" viewport="700x220" name="Sidebar glow" subtitle="La textura de marca vive detrás del rail, difuminada y atenuada" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}</style></head><body>
<div style="display:flex;gap:14px;height:180px">
  <div style="width:200px;border-radius:var(--radius-md);background:var(--sn-texture-rail);position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;backdrop-filter:blur(80px);background:rgba(12,15,20,.42)"></div>
    <div style="position:relative;padding:18px"><span style="display:inline-flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:9px;background:var(--accent);color:var(--sn-orange-ink);font-family:var(--font-display);font-stretch:88%;font-weight:900;font-size:26px;letter-spacing:-0.02em">S</span></div>
  </div>
  <div style="width:200px;border-radius:var(--radius-md);background:var(--sn-texture-rail)"></div>
  <div style="flex:1;border-radius:var(--radius-md);background:var(--bg-app);border:1px solid var(--border-subtle);padding:16px;font-size:12px;color:var(--text-muted)">Sin textura: el área de contenido es plana (#0F1318). La textura solo aparece en el rail y en el hero de sección.</div>
</div></body></html>
