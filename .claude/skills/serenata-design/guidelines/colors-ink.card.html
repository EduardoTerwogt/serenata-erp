<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="color:var(--text-primary);font-size:18px;font-weight:700">text-primary #1D1D1F — headings, table strong cells</div>
<div style="color:var(--text-body);font-size:15px">text-body #3A3A3C — inputs, secondary body copy</div>
<div style="color:var(--text-muted);font-size:14px">text-muted #6E6E73 — nav inactive, muted table cells</div>
<div style="color:var(--text-faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">text-faint #98989D — column headers, footnotes</div>
</div>
</body></html>
