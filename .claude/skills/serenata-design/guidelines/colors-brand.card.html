<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-app);padding:18px;font-family:var(--font-ui)}</style></head><body>
<div style="display:flex;gap:10px;align-items:stretch">
  <div style="flex:1.6;border-radius:var(--radius-md);background:var(--accent);color:var(--sn-orange-ink);padding:16px;display:flex;flex-direction:column;justify-content:space-between">
    <span style="font-family:var(--font-display);font-stretch:88%;font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:-0.01em">Orange</span>
    <span style="font-size:12px;font-weight:600">--accent · #FF5A1A</span>
  </div>
  <div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:#EE4B02;border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font-size:11px;color:var(--text-body);font-weight:600">accent-pressed</div><div style="font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums">#EE4B02 · hover/activo</div></div>
  <div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:#C65008;border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font-size:11px;color:var(--text-body);font-weight:600">accent-quiet</div><div style="font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums">#C65008 · knob, acentos</div></div>
  <div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:#FEFCF9;border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font-size:11px;color:var(--text-body);font-weight:600">orange-ink</div><div style="font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums">#FEFCF9 · texto sobre naranja</div></div>
</div></body></html>
