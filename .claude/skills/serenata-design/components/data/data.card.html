<!-- @dsCard group="Components" viewport="700x340" name="Data — DataTable, StatusBadge, TableFooter" subtitle="Filas con divisor de 1px dentro de una sola tarjeta" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-app);padding:20px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { DataTable, StatusBadge, TableFooter, Card } = window.SerenataDesignSystem_993393;
const mxn=n=>'$ '+n.toLocaleString('es-MX')+' MXN';
const rows=[
 {id:'COT-0084',proyecto:'Campaña Verano 2025',cliente:'Solura',monto:950000,fecha:'25 abr 2025',estatus:'aprobada'},
 {id:'COT-0083',proyecto:'Documental Raíces',cliente:'Canal Norte',monto:420000,fecha:'23 abr 2025',estatus:'emitida'},
 {id:'COT-0082',proyecto:'Serie Digital / Episodio 1',cliente:'Vista Media',monto:1250000,fecha:'20 abr 2025',estatus:'borrador'},
 {id:'COT-0079',proyecto:'Contenido Redes Q2',cliente:'Lúmina',monto:230000,fecha:'12 abr 2025',estatus:'cancelada'}];
const cols=[
 {key:'id',label:'Folio',width:'1fr'},
 {key:'proyecto',label:'Proyecto',width:'1fr'},
 {key:'cliente',label:'Cliente',width:'1fr'},
 {key:'monto',label:'Monto',width:'1fr',render:r=>mxn(r.monto)},
 {key:'estatus',label:'Estatus',width:'110px',align:'right',render:r=><StatusBadge status={r.estatus}/>}];
function Demo(){return(
<Card padding="0">
  <DataTable columns={cols} rows={rows} minWidth={560}/>
  <TableFooter shown={4} total={8} unit="cotizaciones"/>
</Card>);}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script></body></html>
