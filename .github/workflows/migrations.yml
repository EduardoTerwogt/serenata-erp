name: Migrations

on:
  push:
    branches: [main]
    # Un push de solo .md no ejecuta build ni tests. Solo en `push`: en `pull_request` un check omitido
    # por filtro de rutas queda pendiente y bloquearia el merge (los PRs usan el job `changes`).
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  fresh-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Auditoría externa 2026-09-09 (Fase 4.5): db/migrations/ sigue siendo
      # la fuente de verdad -- este job solo verifica que ese conjunto de
      # SQL reconstruye el schema completo desde una base Postgres vacía.
      # "Una migración que no puede reconstruir el schema desde cero no
      # debería entrar a main."
      - name: Generar supabase/migrations/ desde db/migrations/
        run: node scripts/build-supabase-migrations.mjs

      - name: Levantar Postgres local y aplicar todas las migraciones
        run: supabase start --workdir .

      - name: Verificar que el schema reconstruido tiene lo esperado
        run: |
          DB_URL=$(supabase status --workdir . -o env | grep '^DB_URL=' | cut -d'=' -f2- | tr -d '"')
          set -e
          echo "Verificando tablas y funciones clave..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "\d proveedores" | grep -q session_version
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "\d rate_limits" > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "\d idempotency_keys" > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1 from pg_proc where proname = 'check_rate_limit'" | grep -q "1 row"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1 from pg_proc where proname = 'confirmar_match_proveedor'" | grep -q "1 row"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1 from pg_proc where proname = 'approve_cotizacion'" | grep -q "1 row"
          # cuentas_conceptos: plpgsql + force_custom_plan. Como LANGUAGE sql el plan es genérico y hace una sonda por grupo
          # (309,077 contra 7,965 buffers en test, 2026-10-07).
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1 from pg_proc p join pg_language l on l.oid = p.prolang where p.proname = 'cuentas_conceptos' and p.pronargs = 4 and l.lanname = 'plpgsql' and 'plan_cache_mode=force_custom_plan' = any(p.proconfig)" | grep -q "1 row"
          echo "OK -- el schema se reconstruyó desde cero correctamente."

      # J4 (docs/PLAN.md): plpgsql_check sobre todas las funciones de `public`.
      # Un RENAME/DROP COLUMN no avisa si una función aún lee la columna vieja;
      # este paso falla con la lista de errores si hay alguno.
      - name: plpgsql_check — 0 errores en las funciones de public
        run: |
          DB_URL=$(supabase status --workdir . -o env | grep '^DB_URL=' | cut -d'=' -f2- | tr -d '"')
          set -e
          ERRORES=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F ' | ' -f scripts/db/plpgsql-check.sql)
          if [ -n "$ERRORES" ]; then
            echo "plpgsql_check encontró errores:"
            echo "$ERRORES"
            exit 1
          fi
          echo "OK -- plpgsql_check: 0 errores."

      # #110 B2 (decisión 025): prueba de comportamiento del histórico de Cuentas sobre la fixture de scripts/db/cuentas-equivalencia.sql:
      # archivado por componentes, resumen/avisos idénticos con y sin históricos, escrituras rechazadas (RPC y tablas), 27 guardas en 0
      # y que toda RPC de escritura de Cuentas esté cubierta. Corre dentro de una transacción que se deshace.
      - name: Histórico de Cuentas — prueba de comportamiento
        run: |
          DB_URL=$(supabase status --workdir . -o env | grep '^DB_URL=' | cut -d'=' -f2- | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/db/cuentas-historico-prueba.sql

      # Huella del esquema reconstruido desde db/migrations/ (scripts/db/esquema-huella-resumen.sql).
      # No falla: se imprime para compararla con producción y detectar migraciones
      # que ordenan distinto de como se aplicaron (p. ej. 20260916_preview_next…).
      - name: Huella del esquema reconstruido
        run: |
          DB_URL=$(supabase status --workdir . -o env | grep '^DB_URL=' | cut -d'=' -f2- | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F ' | ' -f scripts/db/esquema-huella-resumen.sql

      - name: Detener Supabase local
        if: always()
        run: supabase stop --workdir . || true
