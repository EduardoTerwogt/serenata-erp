name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-and-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET: e2e-super-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      # No necesita ser el secreto real: tests/e2e/utils/realtime-mock.ts
      # intercepta el WebSocket a nivel de transporte y nunca valida el JWT.
      # Solo evita que /api/realtime/token responda 500 en estos tests, para
      # ejercitar la ruta de código real de mint en vez de saltarla.
      SUPABASE_JWT_SECRET: e2e-fake-realtime-secret
      PLAYWRIGHT_E2E_BYPASS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quitar el repo apt de Google Chrome preinstalado en el runner
        # Causa raíz de que "Install Playwright browsers" fallara: el runner
        # de GitHub trae preconfigurado /etc/apt/sources.list.d/google-chrome.list,
        # y `playwright install --with-deps` corre `apt-get update` contra
        # TODOS los repos configurados -- no solo los que necesita. Ese repo
        # de Google (que no usamos: solo instalamos `chromium`, no
        # `google-chrome-stable`) viene sirviendo un Packages.gz con hash
        # mismatch desde el mirror de Azure. Quitarlo antes del apt-get
        # update elimina la causa, no solo reintenta contra el mismo repo roto.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e:smoke

      - name: Run critical flow tests
        run: npm run test:e2e:critical

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  live:
    # Corre en cada push a main, en cada push a un PR y por workflow_dispatch
    # manual. Antes excluia pull_request para no exponer los secretos de
    # Drive/Supabase de PRUEBA a ramas externas -- pero este repo es privado,
    # sin colaboradores externos, y son credenciales de serenata-erp-test, no
    # de produccion, asi que ese riesgo no aplica aqui. Sin este cambio, cada
    # rama/PR necesitaba un workflow_dispatch manual (la integracion de
    # GitHub de Claude no tiene ese permiso) solo para confirmar el nivel que
    # realmente prueba contra servidor y base reales.
    #
    # Ya NO es informativo: este es el unico nivel que prueba contra servidor y
    # base reales (los otros dos mockean las APIs), asi que un fallo aqui es lo
    # unico que puede delatar un bug de colaboracion o de persistencia. Con
    # continue-on-error el workflow salia verde aunque encontrara uno. El deploy
    # a Vercel no se bloquea: se dispara por el push, no por este workflow.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: live-e2e-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      # EF-2 1A-2: expone lib/supabase-browser.ts como window.__e2eSupabaseBrowser
      # SOLO en este build -- necesario para que
      # realtime-channel-reconnection.spec.ts pueda contar canales activos y
      # detectar huérfanos tras una reconexión. Nunca se fija fuera de este job
      # (ni en smoke-and-critical, ni en Vercel).
      NEXT_PUBLIC_E2E_TEST_HOOKS: 'true'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # JWT Secret legacy de serenata-erp-test (Supabase Dashboard -> Settings
      # -> API) -- firma los tokens cortos de app/api/realtime/token, que las
      # políticas RLS de realtime.messages verifican contra el mismo secreto.
      SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN_TEST }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_CUENTAS: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      # Sin esto, si faltara una credencial Playwright marcaria los tests como
      # "skipped" y el job quedaria VERDE sin haber probado nada. Con la variable
      # puesta, el guard de tests/e2e/live/cotizaciones-colaboracion.spec.ts falla
      # y nombra lo que falta.
      PLAYWRIGHT_LIVE_REQUIRED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quitar el repo apt de Google Chrome preinstalado en el runner
        # Causa raíz de que "Install Playwright browsers" fallara: el runner
        # de GitHub trae preconfigurado /etc/apt/sources.list.d/google-chrome.list,
        # y `playwright install --with-deps` corre `apt-get update` contra
        # TODOS los repos configurados -- no solo los que necesita. Ese repo
        # de Google (que no usamos: solo instalamos `chromium`, no
        # `google-chrome-stable`) viene sirviendo un Packages.gz con hash
        # mismatch desde el mirror de Azure. Quitarlo antes del apt-get
        # update elimina la causa, no solo reintenta contra el mismo repo roto.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app against the test environment
        run: npm run build

      - name: Start app in background
        run: nohup npx next start > next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run live integration tests
        run: npm run test:e2e:live

      - name: Dump Next.js server log on failure
        if: failure()
        run: |
          echo "── next-start.log (servidor Next.js real, incluye console.error de las rutas API) ──"
          cat next-start.log || echo "(next-start.log no existe)"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
