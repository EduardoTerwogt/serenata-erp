name: Load Test

# EF-3A 3A-1: infraestructura de carga (k6) -- entorno local (next start en
# el runner) + entorno serverless real (proyecto Vercel aislado, rama de
# despliegue fija loadtest-target, nunca main). Los escenarios de k6 en sí
# los agregan 3A-5 (entorno local)/3A-6 (entorno serverless) a los jobs
# `local`/`serverless` de abajo -- este workflow, tal cual queda en 3A-1,
# solo deja el entorno listo y verificado (env-check) antes de que exista
# tráfico real que mandarle.
#
# Disparo manual porque fija loadtest-target a un SHA arbitrario de main
# (inputs.sha) -- nunca se infiere de un push automático, para que un push
# cualquiera a main no dispare sin querer un deploy al entorno de carga.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA de main a fijar en loadtest-target (debe ser ancestro real de origin/main)'
        required: true
        type: string
      seed_volume:
        description: 'Si es true, en vez de correr el load test, solo siembra el volumen objetivo (EF-3A 3A-3, escala completa: 1,200 proveedores + 1,200 cotizaciones x5 items) en serenata-erp-test -- operacional para el gate de 3C-4, no repite pin/local/serverless'
        required: false
        type: boolean
        default: false
      measure_sync_down:
        description: 'Si es true, el job serverless además mide la duración real de syncAllDown() (POST /api/integrations/sheets/sync-down) contra el entorno serverless -- gate de 3C-4. Sobreescribe TODAS las pestañas de Sheets de serenata-erp-test, así que default false para no hacerlo en cada dispatch normal'
        required: false
        type: boolean
        default: false
      test_item_cell_conflict:
        description: 'Si es true, corre la prueba manual obligatoria de 3D-5 (causa F: PATCH en vuelo sobre la misma celda, sin 409 contra uno mismo) contra el entorno serverless real -- reutiliza tests/e2e/live/cotizaciones-colaboracion.spec.ts, ya cubierto en el job `live` de e2e.yml pero ahí contra un next start local, no el deploy real'
        required: false
        type: boolean
        default: false
      reset_sheets_integration:
        description: 'Si es true, en vez de medir la duración de syncAllDown(), llama POST /api/integrations/sheets/setup contra el entorno serverless para crear un spreadsheet NUEVO con las credenciales reales de ese entorno -- diagnóstico/corrección de F15c (measure_sync_down reportó "Requested entity was not found" en las 9 tablas: el TEST_SHEETS_SPREADSHEET_ID actual no es accesible). El log imprime el ID nuevo; guardarlo a mano en el secreto de GitHub y en Vercel (el job no puede escribirlos)'
        required: false
        type: boolean
        default: false
      full_baseline:
        description: 'THROWAWAY (EF-3 3E-1, orquestación descartable, nunca mergeada a main): en vez de las corridas SMOKE de los jobs local/serverless, corre los 8 escenarios de k6 a duración REAL (sin SMOKE=1, ~12min c/u los 7 concurrentes + ~5min session-version-cost.js aislado) contra local (job local-full) y después contra serverless (job serverless-full, mismo seed compartido), con snapshot de pg_stat_statements antes/después y cleanup del runId -- el gate real de 3E-1. Desactiva los jobs local/serverless (SMOKE) para ese mismo dispatch, evitando tráfico redundante contra el mismo serenata-erp-test compartido'
        required: false
        type: boolean
        default: false
      diag_cuentas:
        description: 'THROWAWAY (EF-3 3E-1, diagnóstico de F27b -- nunca mergeada a main): corre SOLO cuentas.js a duración real contra serverless (job serverless-diag-cuentas), en foreground (sin --summary-export ni backgrounding) para que el log del job traiga status/body real de cada falla con timestamp real de GitHub Actions -- distingue si las fallas de http_req_failed se concentran en el ramp inicial (~30-60s, login synchronized) o se sostienen durante los 11m30s de meseta (capacidad real). No siembra ni limpia nada (cuentas.js es solo lectura). Desactiva local/serverless/local-full/serverless-full para ese mismo dispatch'
        required: false
        type: boolean
        default: false
      diag_cookies:
        description: 'THROWAWAY (EF-3 3E-1, diagnóstico F27b -- nunca mergeada a main): hipótesis puntual de que /api/auth/callback/credentials emite 2 Set-Cookie para el mismo nombre (mismo patrón que rest-login.mjs/env-check.mjs ya tuvieron que resolver a mano con mergeCookies() para /api/auth/csrf) y que el cookie jar automático de k6 no se queda con el último por nombre igual que un browser real -- eso explicaría el 401 "No autenticado" sostenido (no en ráfaga) que encontró serverless-diag-cuentas. 1 VU, 1 iteración -- inspecciona res.cookies/headers crudos de login y de 3 requests autenticados subsiguientes, y el estado del jar entre medio. Segundos de duración real (no es carga)'
        required: false
        type: boolean
        default: false
      diag_cookies_concurrent:
        description: 'THROWAWAY (EF-3 3E-1, diagnóstico F27b -- nunca mergeada a main): la corrida anterior (diag_cookies, 1 VU) descartó Set-Cookie duplicado en el login mismo, pero reveló que NextAuth reemite Set-Cookie de sesión en CADA request autenticada (rolling session), no solo en login -- bajo concurrencia real eso significa cientos de reescrituras del cookie por segundo entre VUs. Esta corrida (5 VUs, 8 iteraciones cada uno, todos logueados con la MISMA cuenta de fixture) loguea el prefijo del token antes/después de cada request, tageado por VU -- si el "antes" de un VU coincide con un "después" que originalmente emitió OTRO VU, es contaminación cruzada del jar entre VUs (contra lo que asume el comentario de _shared.js); si nunca coincide entre VUs pero igual aparecen 401 esporádicos, apunta a otro mecanismo (a confirmar aparte). ~1-2 min reales, no es carga'
        required: false
        type: boolean
        default: false
      diag_cookies_forcejar:
        description: 'THROWAWAY (EF-3 3E-1, diagnóstico F27b -- nunca mergeada a main): diag_cookies_concurrent reprodujo el 401 sostenido a solo 5 VUs/5s -- el cookie de sesión queda AUSENTE del jar de esa VU después de exactamente un uso exitoso (no un valor de otra VU: GitHub Actions enmascara el valor real, así que la comparación literal no fue posible). k6 no expone un constructor de jar nuevo (http.cookieJar() ya es per-VU por diseño, sin config "más explícita" que probar -- docs.k6.io bloqueado por policy de egress de este sandbox). Este diagnóstico en cambio parsea el Set-Cookie crudo a mano tras cada respuesta y lo fuerza al jar vía jar.set() (mismo principio que mergeCookies() de rest-login.mjs/env-check.mjs, último gana por nombre) bajo la MISMA concurrencia (5 VUs) que rompió con el jar 100% automático -- si esto arregla el 401 sostenido, confirma que el manejo automático del jar de k6 es la causa real y valida el patrón exacto del fix. ~1-2 min reales, no es carga'
        required: false
        type: boolean
        default: false
      diag_cookies_local:
        description: 'THROWAWAY (EF-3 3E-1, diagnóstico F27b -- nunca mergeada a main): forcejar (2 intentos, con y sin secure:true en jar.set()) dio EXACTAMENTE el mismo 70%/35 que el jar 100% automático -- descarta el manejo de cookies de k6 (cliente) como causa. El mecanismo es server-side y depende de concurrencia real (≥2 sesiones simultáneas de la MISMA cuenta) -- funciona perfecto a 1 VU. Esta corrida repite el mismo diagnóstico (5 VUs concurrentes) contra local (job local-diag-cookies-concurrent, next start en el propio runner, un solo proceso Node, un solo reloj, sin distribución edge/multi-región) en vez de serverless -- si reproduce IGUAL, descarta cualquier explicación de infraestructura edge de Vercel (multi-región, propagación de env vars/reloj) y confirma que es un bug real de concurrencia en el código de la app (posiblemente afectando a un usuario real con 2 pestañas/dispositivos abiertos a la vez). ~1-2 min reales + build, no es carga'
        required: false
        type: boolean
        default: false

# Mismo group que e2e.yml -- ambos mutan serenata-erp-test y la misma
# carpeta de Drive de test, así que GitHub Actions encola cualquier corrida
# que se solape en vez de dejarlas correr a la vez contra el mismo proyecto
# compartido.
concurrency:
  group: serenata-erp-test-shared
  cancel-in-progress: false

jobs:
  pin-loadtest-target:
    if: ${{ !inputs.seed_volume }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # acotado a ESTE job -- el resto de load-test.yml no lo hereda
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo -- el push siguiente referencia un SHA arbitrario de main, no solo el HEAD superficial que un checkout shallow trae por defecto

      - name: Guard -- solo se permite fijar loadtest-target desde un SHA que sea ancestro real de origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} no es un ancestro de origin/main -- abortando, nunca se fuerza un push a loadtest-target con un SHA arbitrario o de una rama distinta." >&2
            exit 1
          fi

      - name: Fijar loadtest-target al SHA exacto
        run: git push --force-with-lease origin "${{ inputs.sha }}:refs/heads/loadtest-target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Esperar a que el deployment del proyecto Vercel aislado quede READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: ${{ secrets.LOADTEST_VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          ARGS=(--project-id "${{ secrets.LOADTEST_VERCEL_PROJECT_ID }}" --sha "${{ inputs.sha }}" --timeout-seconds 300)
          if [ -n "$TEAM_ID" ]; then
            ARGS+=(--team-id "$TEAM_ID")
          fi
          node scripts/loadtest/wait-for-deployment.mjs "${ARGS[@]}"

  local:
    if: ${{ !inputs.seed_volume && !inputs.full_baseline && !inputs.diag_cuentas && !inputs.diag_cookies && !inputs.diag_cookies_concurrent && !inputs.diag_cookies_forcejar && !inputs.diag_cookies_local }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tabla exacta de 3A-1 -- verificada contra el job `live` real de
      # e2e.yml, no un remapeo genérico.
      AUTH_SECRET: loadtest-e2e-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: loadtest-cron-secret
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN_TEST }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_CUENTAS: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      LOADTEST_MODE: 'true'
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      # Variables que solo usan los scripts, nunca las lee `next start`:
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app against the test environment
        run: npm run build

      - name: Start app in background
        run: nohup npx next start > next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: env-check -- confirmar que apunta a serenata-erp-test antes de cualquier tráfico
        run: node scripts/loadtest/env-check.mjs --target-url http://127.0.0.1:3000

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # Snapshot "antes" -- 3A-5 (c): pg_stat_statements_snapshot() trae el
      # universo completo (nunca un top-N que sesga los deltas). El
      # snapshot "después" se toma tras las corridas SMOKE que escriben
      # datos, antes del cleanup -- pg_stat_statements mide estadísticas de
      # queries, no filas, así que el cleanup no afecta el delta.
      - name: k6 (3A-5) -- snapshot de pg_stat_statements ANTES
        run: node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-before.json

      # SMOKE=1 corre cada escenario 1 sola vez (options.scenarios no se
      # puede pisar con flags de CLI, ver _shared.js) -- confirma que el
      # script real funciona contra este entorno antes de que 3A-6 los
      # corra a escala completa. Los escenarios que faltan (3A-5 PR b/c) se
      # agregan aquí según se mergeen.
      - name: SMOKE navegacion-proyectos.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/navegacion-proyectos.js

      - name: SMOKE dashboard.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/dashboard.js

      - name: SMOKE cuentas.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/cuentas.js

      # Los escenarios que escriben datos (3A-5 PR b) necesitan un runId
      # real (para taggear filas y limpiarlas después), una carpeta real de
      # Drive (3A-4) y, para portal.js, sesiones de Portal ya firmadas
      # (3A-2) -- se preparan una sola vez aquí y se limpian todas juntas al
      # final vía bulk-cleanup.mjs (ya registra/borra también la carpeta de
      # Drive por runId, ahora que loadtest_runs existe en serenata-erp-test).
      - name: k6 (3A-5) -- generar runId para las corridas SMOKE que escriben datos
        run: echo "SMOKE_RUN_ID=$(node -e "process.stdout.write(crypto.randomUUID())")" >> "$GITHUB_ENV"

      - name: k6 (3A-5) -- crear carpeta real de Drive para la corrida SMOKE
        run: |
          set -euo pipefail
          node scripts/loadtest/create-drive-run-folder.mjs --target-url http://127.0.0.1:3000 --run-id "$SMOKE_RUN_ID" | tee /tmp/create-drive-folder.log
          grep '^LOADTEST_DRIVE_FOLDER_ID=' /tmp/create-drive-folder.log >> "$GITHUB_ENV"

      - name: k6 (3A-5) -- fixture de Portal para SMOKE (1 sesión)
        run: node scripts/loadtest/prepare-portal-fixtures.mjs --target-url http://127.0.0.1:3000 --run-id "$SMOKE_RUN_ID" --count 1 --out portal-fixtures-smoke.json

      - name: SMOKE crear-cotizaciones.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env RUN_ID="$SMOKE_RUN_ID" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/crear-cotizaciones.js

      - name: SMOKE editar-concurrente.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env RUN_ID="$SMOKE_RUN_ID" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" --env TEST_SUPABASE_URL="$TEST_SUPABASE_URL" --env TEST_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" scripts/loadtest/k6/editar-concurrente.js

      - name: SMOKE session-version-cost.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env RUN_ID="$SMOKE_RUN_ID" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/session-version-cost.js

      - name: SMOKE uploads.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env RUN_ID="$SMOKE_RUN_ID" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" --env LOADTEST_DRIVE_FOLDER_ID="$LOADTEST_DRIVE_FOLDER_ID" --env LOADTEST_ENV_SECRET="$LOADTEST_ENV_SECRET" scripts/loadtest/k6/uploads.js

      - name: SMOKE portal.js
        run: SMOKE=1 k6 run --env TARGET_URL=http://127.0.0.1:3000 --env PORTAL_FIXTURES_FILE="$GITHUB_WORKSPACE/portal-fixtures-smoke.json" scripts/loadtest/k6/portal.js

      - name: k6 (3A-5) -- snapshot de pg_stat_statements DESPUÉS + deltas reales
        run: |
          node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-after.json
          node scripts/loadtest/telemetry-deltas.mjs --before telemetry-before.json --after telemetry-after.json --run-id "$SMOKE_RUN_ID"
          cat "docs/archive/telemetry/${SMOKE_RUN_ID}-pg-stat-deltas.json" | head -c 2000

      - name: k6 (3A-5) -- limpiar datos y carpeta de Drive de la corrida SMOKE
        if: always()
        run: node scripts/loadtest/bulk-cleanup.mjs --target-url http://127.0.0.1:3000 --run-id "$SMOKE_RUN_ID"

      - name: Dump Next.js server log on failure
        if: failure()
        run: |
          echo "── next-start.log ──"
          cat next-start.log || echo "(next-start.log no existe)"

  serverless:
    # No arranca hasta que `local` completó su propio ciclo -- ambos jobs
    # mutan la MISMA base serenata-erp-test y la misma carpeta de Drive de
    # test, así que correr en paralelo dentro de la misma corrida de
    # workflow_dispatch corrompería el ciclo de datos compartidos.
    # `pin-loadtest-target` sí corre en paralelo con `local` porque solo
    # prepara el deploy remoto, no toca datos compartidos.
    if: ${{ !inputs.seed_volume && !inputs.full_baseline && !inputs.diag_cuentas && !inputs.diag_cookies && !inputs.diag_cookies_concurrent && !inputs.diag_cookies_forcejar && !inputs.diag_cookies_local }}
    needs: [pin-loadtest-target, local]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "${{ secrets.LOADTEST_SERVERLESS_URL }}"

      # EF-3 3C-4: gate obligatorio -- duración real de syncAllDown() contra
      # el volumen objetivo ya sembrado (Bloque 4), en el entorno
      # serverless real. Opt-in (measure_sync_down) porque sobreescribe TODAS
      # las pestañas de la hoja de test -- no se quiere ese efecto lateral en
      # cada dispatch normal de load-test.yml.
      - name: EF-3 3C-4 -- medir duración real de syncAllDown() contra el entorno serverless
        if: ${{ inputs.measure_sync_down }}
        run: node scripts/loadtest/measure-sync-down-duration.mjs --target-url "${{ secrets.LOADTEST_SERVERLESS_URL }}"

      # F15c: measure_sync_down reveló que las 9 tablas fallan con "Requested
      # entity was not found" contra el TEST_SHEETS_SPREADSHEET_ID actual --
      # opt-in aparte porque crea un spreadsheet nuevo (efecto lateral que
      # no se quiere en cada dispatch normal) y porque requiere una acción
      # manual posterior (guardar el ID nuevo en el secreto/Vercel).
      - name: EF-3 3C-4 (F15c) -- crear spreadsheet nuevo con las credenciales reales del entorno serverless
        if: ${{ inputs.reset_sheets_integration }}
        run: node scripts/loadtest/reset-sheets-integration.mjs --target-url "${{ secrets.LOADTEST_SERVERLESS_URL }}"

      # Los 8 escenarios de k6 contra el entorno serverless real los agrega 3A-6.

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, diagnóstico de F27b (nunca mergeada a main):
  # el ciclo real de 3E-1 (jobs de abajo) encontró que 6 de 7 escenarios
  # concurrentes rompen http_req_failed<1% -- IGUAL en local y serverless,
  # incluso después de arreglar F27 (cuentas_por_proyecto()) -- solo
  # portal.js (bypass de sesión HMAC, sin login real) pasa limpio. Este job
  # corre SOLO cuentas.js a duración real, EN FOREGROUND (sin
  # --summary-export ni backgrounding, sin redirigir stdout a un archivo)
  # para que el log del job traiga status/body real de cada falla, con el
  # timestamp real que GitHub Actions ya le pone a cada línea -- eso separa
  # 2 hipótesis sin ambigüedad: fallas concentradas en el ramp inicial
  # (~30-60s, ~130 logins reales de NextAuth sincronizados por el ramp de
  # ramping-vus, ya que cada VU hace loginStaff() UNA sola vez en su
  # primera iteración) vs. fallas sostenidas durante los 11m30s de meseta
  # (problema real de capacidad, no un artefacto del perfil de carga
  # sintético de este load test). cuentas.js es de solo lectura -- no
  # siembra ni necesita cleanup propio.
  serverless-diag-cuentas:
    if: ${{ inputs.diag_cuentas }}
    needs: [pin-loadtest-target]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # EN FOREGROUND a propósito (sin --summary-export, sin backgrounding,
      # sin redirigir a un archivo) -- todo el stdout de k6 (su resumen
      # default + las líneas DIAG-FAIL) va directo al log del job, que sí
      # se puede leer completo con get_job_logs (el artifact zip en blob
      # storage no es descargable desde este sandbox).
      - name: 3E-1 diag -- cuentas.js a duración real contra serverless (foreground)
        run: k6 run --env TARGET_URL="$TARGET_URL" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/cuentas.js

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, diagnóstico puntual de F27b (nunca mergeada a
  # main): hipótesis del coordinador -- el mismo bug de Set-Cookie
  # duplicado por nombre que rest-login.mjs/env-check.mjs ya tuvieron que
  # resolver a mano (mergeCookies(), última wins) para GET /api/auth/csrf
  # podría estar TAMBIÉN presente en el cookie de sesión real que emite
  # POST /api/auth/callback/credentials -- y el cookie jar automático de k6
  # (a diferencia del merge manual de los scripts Node) podría no aplicar
  # "el último Set-Cookie del mismo nombre gana" igual que un browser real,
  # lo que explicaría el 401 "No autenticado" SOSTENIDO (no en ráfaga) que
  # encontró serverless-diag-cuentas. 1 VU, 1 iteración -- segundos de
  # duración real, no es carga.
  serverless-diag-cookies:
    if: ${{ inputs.diag_cookies }}
    needs: [pin-loadtest-target]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 diag -- inspección cruda de Set-Cookie/jar contra serverless (foreground)
        run: k6 run --env TARGET_URL="$TARGET_URL" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/_diag-cookies.js

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, diagnóstico puntual de F27b (nunca mergeada a
  # main): serverless-diag-cookies (1 VU) descartó Set-Cookie duplicado en
  # el login mismo, pero reveló que NextAuth reemite Set-Cookie de sesión
  # en CADA request autenticada (rolling session), no solo en login. Esta
  # corrida (5 VUs concurrentes, mismo staff de fixture) distingue si el
  # jar de k6 se contamina ENTRE VUs (contra lo que asume _shared.js) bajo
  # esa reescritura constante -- cada línea trae el prefijo del token
  # antes/después de cada request, tageado por vu/iter, comparable entre
  # VUs. ~1-2 min reales, no es carga.
  serverless-diag-cookies-concurrent:
    if: ${{ inputs.diag_cookies_concurrent }}
    needs: [pin-loadtest-target]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 diag -- contaminación cruzada de jar entre 5 VUs concurrentes (foreground)
        run: k6 run --env TARGET_URL="$TARGET_URL" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/_diag-cookies-concurrent.js

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, diagnóstico puntual de F27b (nunca mergeada a
  # main): serverless-diag-cookies-concurrent reprodujo el 401 sostenido a
  # solo 5 VUs/5s -- el cookie de sesión queda AUSENTE del jar de esa VU
  # tras exactamente un uso exitoso. k6 no expone un jar nuevo/separado
  # que crear (http.cookieJar() ya es per-VU por diseño). Esta corrida
  # fuerza el Set-Cookie correcto al jar a mano tras cada respuesta
  # (jar.set(), mismo principio que mergeCookies() de rest-login.mjs) bajo
  # la MISMA concurrencia -- si arregla el 401 sostenido, confirma que el
  # manejo automático del jar de k6 es la causa real.
  serverless-diag-cookies-forcejar:
    if: ${{ inputs.diag_cookies_forcejar }}
    needs: [pin-loadtest-target]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 diag -- forzar Set-Cookie correcto al jar a mano, 5 VUs concurrentes (foreground)
        run: k6 run --env TARGET_URL="$TARGET_URL" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/_diag-cookies-forcejar.js

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, diagnóstico puntual de F27b (nunca mergeada a
  # main): forcejar (2 intentos, con y sin secure:true) dio el MISMO
  # 70%/35 que el jar 100% automático -- descarta el manejo de cookies de
  # k6 como causa. El mecanismo es server-side y depende de concurrencia
  # real (≥2 sesiones simultáneas de la MISMA cuenta). Esta corrida repite
  # el mismo diagnóstico contra LOCAL (next start en el propio runner, un
  # solo proceso Node, un solo reloj, sin distribución edge/multi-región)
  # en vez de serverless -- si reproduce igual, descarta cualquier
  # explicación de infraestructura edge de Vercel y confirma un bug real
  # de concurrencia en el código de la app.
  local-diag-cookies-concurrent:
    if: ${{ inputs.diag_cookies_local }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: loadtest-e2e-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: loadtest-cron-secret
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN_TEST }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_CUENTAS: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      LOADTEST_MODE: 'true'
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app against the test environment
        run: npm run build

      - name: Start app in background
        run: nohup npx next start > next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: env-check -- confirmar que apunta a serenata-erp-test antes de cualquier tráfico
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 diag -- contaminación cruzada/concurrencia contra local, 5 VUs (foreground)
        run: k6 run --env TARGET_URL="$TARGET_URL" --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" scripts/loadtest/k6/_diag-cookies-concurrent.js

      - name: Dump Next.js server log on failure
        if: failure()
        run: |
          echo "── next-start.log ──"
          cat next-start.log || echo "(next-start.log no existe)"

  # ---------------------------------------------------------------------
  # EF-3 3E-1 -- THROWAWAY, orquestación descartable (nunca mergeada a
  # main, ver docs/EF-3_ENGINEERING_HARDENING.md 3E-1 punto 1 y
  # docs/archive/ef-3-baseline-previo.md): ciclo real (no SMOKE) de los 8
  # escenarios de k6, gate real de umbrales, contra local (este job) y
  # después contra serverless (job serverless-full de abajo, mismo seed
  # compartido de serenata-erp-test).
  #
  # Fix del bug real que abortó el intento de 3A-6 (cascada de fallo:
  # `wait $PID` de un escenario que rompió su propio umbral, bajo
  # `bash -e` -- ver docs/archive/ef-3-baseline-previo.md "Cascada de
  # fallo"): el paso que lanza los 7 escenarios concurrentes corre con
  # `set +e` y exporta un `--summary-export=results/<nombre>.json` +
  # `results/<nombre>.exit` por escenario, terminando siempre en `exit 0`
  # -- un umbral roto en cualquiera de los 7 nunca aborta el resto del
  # job. session-version-cost.js corre aislado DESPUÉS (mismo criterio que
  # 3A-5/3A-6), y el snapshot "después"+deltas y el cleanup del runId
  # corren siempre (`if: always()`), pase lo que pase con los umbrales.
  local-full:
    if: ${{ inputs.full_baseline && !inputs.diag_cuentas && !inputs.diag_cookies && !inputs.diag_cookies_concurrent && !inputs.diag_cookies_forcejar && !inputs.diag_cookies_local }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Misma tabla exacta que el job `local` (3A-1, verificada contra el
      # job `live` real de e2e.yml).
      AUTH_SECRET: loadtest-e2e-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: loadtest-cron-secret
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN_TEST }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_CUENTAS: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      LOADTEST_MODE: 'true'
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app against the test environment
        run: npm run build

      - name: Start app in background
        run: nohup npx next start > next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: env-check -- confirmar que apunta a serenata-erp-test antes de cualquier tráfico
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 -- snapshot de pg_stat_statements ANTES (ciclo completo)
        run: node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-before-full.json

      - name: 3E-1 -- generar runId del ciclo completo
        run: echo "FULL_RUN_ID=$(node -e "process.stdout.write(crypto.randomUUID())")" >> "$GITHUB_ENV"

      - name: 3E-1 -- crear carpeta real de Drive para el ciclo completo
        run: |
          set -euo pipefail
          node scripts/loadtest/create-drive-run-folder.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" | tee /tmp/create-drive-folder-full.log
          grep '^LOADTEST_DRIVE_FOLDER_ID=' /tmp/create-drive-folder-full.log >> "$GITHUB_ENV"

      - name: 3E-1 -- fixtures reales de Portal (150 sesiones firmadas)
        run: node scripts/loadtest/prepare-portal-fixtures.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" --count 150 --out portal-fixtures-full.json

      - name: 3E-1 -- lanzar los 7 escenarios concurrentes a duración real (sin SMOKE), nunca abortar por un umbral roto
        run: |
          set +e
          mkdir -p results

          k6 run --summary-export=results/crear-cotizaciones.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/crear-cotizaciones.js > results/crear-cotizaciones.log 2>&1 &
          PID_CREAR=$!

          k6 run --summary-export=results/editar-concurrente.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            --env TEST_SUPABASE_URL="$TEST_SUPABASE_URL" --env TEST_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" \
            scripts/loadtest/k6/editar-concurrente.js > results/editar-concurrente.log 2>&1 &
          PID_EDITAR=$!

          k6 run --summary-export=results/navegacion-proyectos.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/navegacion-proyectos.js > results/navegacion-proyectos.log 2>&1 &
          PID_NAV=$!

          k6 run --summary-export=results/dashboard.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/dashboard.js > results/dashboard.log 2>&1 &
          PID_DASH=$!

          k6 run --summary-export=results/cuentas.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/cuentas.js > results/cuentas.log 2>&1 &
          PID_CUENTAS=$!

          k6 run --summary-export=results/portal.json \
            --env TARGET_URL="$TARGET_URL" --env PORTAL_FIXTURES_FILE="$GITHUB_WORKSPACE/portal-fixtures-full.json" \
            scripts/loadtest/k6/portal.js > results/portal.log 2>&1 &
          PID_PORTAL=$!

          k6 run --summary-export=results/uploads.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            --env LOADTEST_DRIVE_FOLDER_ID="$LOADTEST_DRIVE_FOLDER_ID" --env LOADTEST_ENV_SECRET="$LOADTEST_ENV_SECRET" \
            scripts/loadtest/k6/uploads.js > results/uploads.log 2>&1 &
          PID_UPLOADS=$!

          wait $PID_CREAR;   echo $? > results/crear-cotizaciones.exit
          wait $PID_EDITAR;  echo $? > results/editar-concurrente.exit
          wait $PID_NAV;     echo $? > results/navegacion-proyectos.exit
          wait $PID_DASH;    echo $? > results/dashboard.exit
          wait $PID_CUENTAS; echo $? > results/cuentas.exit
          wait $PID_PORTAL;  echo $? > results/portal.exit
          wait $PID_UPLOADS; echo $? > results/uploads.exit

          echo "── Exit codes (0 = k6 corrió y sus umbrales pasaron) ──"
          for f in results/*.exit; do echo "$f: $(cat "$f")"; done
          exit 0

      - name: 3E-1 -- session-version-cost.js aislado (después de los 7 concurrentes)
        if: always()
        run: |
          set +e
          k6 run --summary-export=results/session-version-cost.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/session-version-cost.js > results/session-version-cost.log 2>&1
          echo $? > results/session-version-cost.exit
          exit 0

      # Imprime las métricas reales de cada escenario DIRECTO al log del job
      # (texto, recuperable por get_job_logs) en vez de depender solo del
      # artifact subido (zip en blob storage, no descargable desde este
      # sandbox por policy de egress) -- así el número real de cada
      # escenario queda en un lugar que sí se puede leer después.
      - name: 3E-1 -- imprimir métricas reales de k6 (compacto, al log del job)
        if: always()
        run: |
          node -e "const fs=require('fs');const dir='results';for(const f of fs.readdirSync(dir).filter(f=>f.endsWith('.json')).sort()){let j;try{j=JSON.parse(fs.readFileSync(dir+'/'+f,'utf8'))}catch(e){console.log('=== '+f+' NO PARSEABLE ('+e.message+') ===');continue}const m=j.metrics||{};const pick=(n)=>{const mm=m[n];return mm?{values:mm.values,thresholds:mm.thresholds}:null};console.log('=== '+f+' ===');console.log(JSON.stringify({iterations:(m.iterations||{}).values,vus_max:(m.vus_max||{}).values,http_reqs:(m.http_reqs||{}).values,http_req_duration:pick('http_req_duration'),http_req_failed:pick('http_req_failed'),checks:(m.checks||{}).values}))}"

      - name: 3E-1 -- snapshot de pg_stat_statements DESPUÉS + deltas reales
        if: always()
        run: |
          node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-after-full.json
          node scripts/loadtest/telemetry-deltas.mjs --before telemetry-before-full.json --after telemetry-after-full.json --run-id "$FULL_RUN_ID"
          cat "docs/archive/telemetry/${FULL_RUN_ID}-pg-stat-deltas.json" | head -c 4000

      # No-fatal a propósito: bulk-cleanup.mjs SIEMPRE borra las filas de
      # Postgres primero (crítico) y recién después intenta borrar la
      # carpeta de Drive -- a escala real (uploads.js real, no SMOKE) la
      # carpeta acumula muchos más archivos que en SMOKE (1-3), y el borrado
      # de carpeta de Drive con muchos hijos puede devolver 403/500
      # ("may not have granted the app write access to all children") --
      # mismo tipo de huérfano ya documentado y tolerado en 3A-6
      # (docs/archive/ef-3-baseline-previo.md), que se autolimpia en un
      # --sweep-orphans futuro. Este job (throwaway, nunca mergea a main) no
      # debe fallar completo por eso -- fallar completo bloquearía
      # `serverless-full` vía `needs: local-full`, perdiendo el gate real
      # que sí importa. El log de bulk-cleanup.mjs ya deja explícito cuántas
      # filas borró antes de intentar la carpeta.
      - name: 3E-1 -- limpiar datos y carpeta de Drive del ciclo completo
        if: always()
        run: |
          node scripts/loadtest/bulk-cleanup.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" \
            || echo "::warning::bulk-cleanup.mjs salió con error (folder de Drive con muchos hijos, ver 3E-1) -- las filas de Postgres se limpiaron antes de ese punto, carpeta huérfana documentada para --sweep-orphans"

      # Siempre (no solo on failure): 3E-1 punto 2 exige revisar la firma de
      # "Bloque 7" (fallas rápidas + next-start.log limpio = contención de
      # CPU del runner compartido, no límite real de la app) contra ESTA
      # corrida, no asumirla del intento anterior.
      - name: 3E-1 -- volcar next-start.log completo (siempre, para la firma de Bloque 7)
        if: always()
        run: |
          echo "── next-start.log ──"
          cat next-start.log || echo "(next-start.log no existe)"

      - name: 3E-1 -- subir resultados reales (JSON de k6 + logs + telemetría)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef3e1-local-full-results
          path: |
            results/**
            telemetry-before-full.json
            telemetry-after-full.json
            docs/archive/telemetry/*-pg-stat-deltas.json
          if-no-files-found: warn
          retention-days: 14

  serverless-full:
    # Corre DESPUÉS de local-full -- mismo motivo que serverless/local:
    # ambos mutan la misma serenata-erp-test compartida, sin solaparse.
    if: ${{ inputs.full_baseline && !inputs.diag_cuentas && !inputs.diag_cookies && !inputs.diag_cookies_concurrent && !inputs.diag_cookies_forcejar && !inputs.diag_cookies_local }}
    needs: [pin-loadtest-target, local-full]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      TARGET_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: env-check -- confirmar que el deployment serverless apunta a serenata-erp-test
        run: node scripts/loadtest/env-check.mjs --target-url "$TARGET_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: 3E-1 -- snapshot de pg_stat_statements ANTES (ciclo completo, serverless)
        run: node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-before-full.json

      - name: 3E-1 -- generar runId del ciclo completo (serverless)
        run: echo "FULL_RUN_ID=$(node -e "process.stdout.write(crypto.randomUUID())")" >> "$GITHUB_ENV"

      - name: 3E-1 -- crear carpeta real de Drive para el ciclo completo (serverless)
        run: |
          set -euo pipefail
          node scripts/loadtest/create-drive-run-folder.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" | tee /tmp/create-drive-folder-full.log
          grep '^LOADTEST_DRIVE_FOLDER_ID=' /tmp/create-drive-folder-full.log >> "$GITHUB_ENV"

      - name: 3E-1 -- fixtures reales de Portal (150 sesiones firmadas, serverless)
        run: node scripts/loadtest/prepare-portal-fixtures.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" --count 150 --out portal-fixtures-full.json

      - name: 3E-1 -- lanzar los 7 escenarios concurrentes a duración real (sin SMOKE), nunca abortar por un umbral roto (serverless)
        run: |
          set +e
          mkdir -p results

          k6 run --summary-export=results/crear-cotizaciones.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/crear-cotizaciones.js > results/crear-cotizaciones.log 2>&1 &
          PID_CREAR=$!

          k6 run --summary-export=results/editar-concurrente.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            --env TEST_SUPABASE_URL="$TEST_SUPABASE_URL" --env TEST_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" \
            scripts/loadtest/k6/editar-concurrente.js > results/editar-concurrente.log 2>&1 &
          PID_EDITAR=$!

          k6 run --summary-export=results/navegacion-proyectos.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/navegacion-proyectos.js > results/navegacion-proyectos.log 2>&1 &
          PID_NAV=$!

          k6 run --summary-export=results/dashboard.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/dashboard.js > results/dashboard.log 2>&1 &
          PID_DASH=$!

          k6 run --summary-export=results/cuentas.json \
            --env TARGET_URL="$TARGET_URL" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/cuentas.js > results/cuentas.log 2>&1 &
          PID_CUENTAS=$!

          k6 run --summary-export=results/portal.json \
            --env TARGET_URL="$TARGET_URL" --env PORTAL_FIXTURES_FILE="$GITHUB_WORKSPACE/portal-fixtures-full.json" \
            scripts/loadtest/k6/portal.js > results/portal.log 2>&1 &
          PID_PORTAL=$!

          k6 run --summary-export=results/uploads.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            --env LOADTEST_DRIVE_FOLDER_ID="$LOADTEST_DRIVE_FOLDER_ID" --env LOADTEST_ENV_SECRET="$LOADTEST_ENV_SECRET" \
            scripts/loadtest/k6/uploads.js > results/uploads.log 2>&1 &
          PID_UPLOADS=$!

          wait $PID_CREAR;   echo $? > results/crear-cotizaciones.exit
          wait $PID_EDITAR;  echo $? > results/editar-concurrente.exit
          wait $PID_NAV;     echo $? > results/navegacion-proyectos.exit
          wait $PID_DASH;    echo $? > results/dashboard.exit
          wait $PID_CUENTAS; echo $? > results/cuentas.exit
          wait $PID_PORTAL;  echo $? > results/portal.exit
          wait $PID_UPLOADS; echo $? > results/uploads.exit

          echo "── Exit codes (0 = k6 corrió y sus umbrales pasaron) ──"
          for f in results/*.exit; do echo "$f: $(cat "$f")"; done
          exit 0

      - name: 3E-1 -- session-version-cost.js aislado (después de los 7 concurrentes, serverless)
        if: always()
        run: |
          set +e
          k6 run --summary-export=results/session-version-cost.json \
            --env TARGET_URL="$TARGET_URL" --env RUN_ID="$FULL_RUN_ID" \
            --env PLAYWRIGHT_TEST_EMAIL="$PLAYWRIGHT_TEST_EMAIL" --env PLAYWRIGHT_TEST_PASSWORD="$PLAYWRIGHT_TEST_PASSWORD" \
            scripts/loadtest/k6/session-version-cost.js > results/session-version-cost.log 2>&1
          echo $? > results/session-version-cost.exit
          exit 0

      # Ver el comentario equivalente en local-full.
      - name: 3E-1 -- imprimir métricas reales de k6 (compacto, al log del job, serverless)
        if: always()
        run: |
          node -e "const fs=require('fs');const dir='results';for(const f of fs.readdirSync(dir).filter(f=>f.endsWith('.json')).sort()){let j;try{j=JSON.parse(fs.readFileSync(dir+'/'+f,'utf8'))}catch(e){console.log('=== '+f+' NO PARSEABLE ('+e.message+') ===');continue}const m=j.metrics||{};const pick=(n)=>{const mm=m[n];return mm?{values:mm.values,thresholds:mm.thresholds}:null};console.log('=== '+f+' ===');console.log(JSON.stringify({iterations:(m.iterations||{}).values,vus_max:(m.vus_max||{}).values,http_reqs:(m.http_reqs||{}).values,http_req_duration:pick('http_req_duration'),http_req_failed:pick('http_req_failed'),checks:(m.checks||{}).values}))}"

      - name: 3E-1 -- snapshot de pg_stat_statements DESPUÉS + deltas reales (serverless)
        if: always()
        run: |
          node scripts/loadtest/telemetry-snapshot.mjs --out telemetry-after-full.json
          node scripts/loadtest/telemetry-deltas.mjs --before telemetry-before-full.json --after telemetry-after-full.json --run-id "$FULL_RUN_ID"
          cat "docs/archive/telemetry/${FULL_RUN_ID}-pg-stat-deltas.json" | head -c 4000

      # No-fatal a propósito -- ver el comentario equivalente en local-full.
      - name: 3E-1 -- limpiar datos y carpeta de Drive del ciclo completo (serverless)
        if: always()
        run: |
          node scripts/loadtest/bulk-cleanup.mjs --target-url "$TARGET_URL" --run-id "$FULL_RUN_ID" \
            || echo "::warning::bulk-cleanup.mjs salió con error (folder de Drive con muchos hijos, ver 3E-1) -- las filas de Postgres se limpiaron antes de ese punto, carpeta huérfana documentada para --sweep-orphans"

      - name: 3E-1 -- subir resultados reales (JSON de k6 + logs + telemetría, serverless)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef3e1-serverless-full-results
          path: |
            results/**
            telemetry-before-full.json
            telemetry-after-full.json
            docs/archive/telemetry/*-pg-stat-deltas.json
          if-no-files-found: warn
          retention-days: 14

  # EF-3A 3A-3, corrida a escala completa (operacional, no un bloque de la
  # spec): siembra 1,200 proveedores + 1,200 cotizaciones x5 items en
  # serenata-erp-test vía los mismos 3 endpoints REST reales que usa un
  # usuario (create/emitir/aprobar -- ver seed-volume-fixtures.mjs, no
  # reimplementa la orquestación de approve_cotizacion en JS plano). A
  # diferencia de las corridas SMOKE de `local`/`serverless`, esta siembra
  # es deliberadamente PERMANENTE (sin bulk-cleanup.mjs al final): su
  # propósito es dejar volumen realista instalado en serenata-erp-test para
  # que 3C-4 (y cualquier medición futura) tenga datos reales contra los
  # que correr, no datos de una sola corrida descartable. Corre contra un
  # `next start` local (no el proyecto Vercel serverless aislado) porque
  # aquí no se mide rendimiento de la app -- solo se necesita un servidor
  # real para autenticar y llamar los 3 endpoints; usar `local` evita
  # depender del deploy de loadtest-target y de su rate limit de Vercel
  # (documentado en 3A-6) para una tarea que no lo requiere.
  seed-volumen:
    if: ${{ inputs.seed_volume }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Misma tabla que el job `local` -- se necesita el mismo `next start`
      # real para autenticar contra /api/auth y llamar los endpoints reales.
      AUTH_SECRET: loadtest-e2e-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: loadtest-cron-secret
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN_TEST }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_CUENTAS: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
      LOADTEST_MODE: 'true'
      LOADTEST_ENV_SECRET: ${{ secrets.LOADTEST_ENV_SECRET }}
      # Variables que solo usan los scripts (env-check.mjs,
      # seed-volume-fixtures.mjs), nunca `next start`:
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_TEST_FOLDER_ID: ${{ secrets.DRIVE_TEST_FOLDER_ID }}
      TEST_SHEETS_SPREADSHEET_ID: ${{ secrets.TEST_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app against the test environment
        run: npm run build

      - name: Start app in background
        run: nohup npx next start > next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: env-check -- confirmar que apunta a serenata-erp-test antes de sembrar nada
        run: node scripts/loadtest/env-check.mjs --target-url http://127.0.0.1:3000

      - name: Generar runId de la siembra de volumen
        run: echo "SEED_RUN_ID=$(node -e "process.stdout.write(crypto.randomUUID())")" >> "$GITHUB_ENV"

      - name: Sembrar volumen objetivo completo (1,200 proveedores + 1,200 cotizaciones x5 items)
        run: node scripts/loadtest/seed-volume-fixtures.mjs --target-url http://127.0.0.1:3000 --run-id "$SEED_RUN_ID"

      - name: Dump Next.js server log on failure
        if: failure()
        run: |
          echo "── next-start.log ──"
          cat next-start.log || echo "(next-start.log no existe)"

  # EF-3 3D-5, criterio de aceptación ("prueba manual adicional
  # obligatoria... editar la misma celda repetidamente con el PATCH
  # anterior en vuelo, confirmar que no se pierde ninguna edición y no
  # aparece un 409 contra uno mismo"): reutiliza VERBATIM el test "causa F"
  # de tests/e2e/live/cotizaciones-colaboracion.spec.ts (ya prueba
  # exactamente ese escenario, y ya corre en cada push al job `live` de
  # e2e.yml) -- la única diferencia real es apuntar `PLAYWRIGHT_BASE_URL`
  # al deploy real de `serenata-erp-loadtest` en vez de un `next start`
  # local, algo que `playwright.config.ts` ya soporta sin cambios (usa la
  # URL externa directo, sin levantar servidor). No se reescribe el
  # escenario: sería exactamente el mismo código con más riesgo de
  # divergir del real con el tiempo.
  test-item-cell-conflict:
    if: ${{ inputs.test_item_cell_conflict }}
    needs: [pin-loadtest-target]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.LOADTEST_SERVERLESS_URL }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      # Sin esto, si faltara una credencial Playwright marcaría el test
      # como "skipped" y el job quedaría VERDE sin haber probado nada --
      # mismo guard que usa el job `live` de e2e.yml.
      PLAYWRIGHT_LIVE_REQUIRED: 'true'
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quitar el repo apt de Google Chrome preinstalado en el runner
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: EF-3 3D-5 -- prueba manual (causa F) contra el entorno serverless real
        run: npx playwright test tests/e2e/live/cotizaciones-colaboracion.spec.ts -g "causa F" --reporter=list

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-item-cell-conflict-artifacts
          path: playwright-report
