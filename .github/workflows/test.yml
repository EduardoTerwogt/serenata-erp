name: Test Suite

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tracker-lint:
    # EF-3 3A-0b: valida la estructura del tracker de EF-3 (Sección 11 de
    # docs/archive/ef-3-engineering-hardening.md, ruta activa mientras EF-3
    # corría). TODO push/PR, sin condicionar por path -- GitHub Actions no ofrece un
    # filtro de `paths` confiable a nivel de job (solo a nivel del
    # disparador del workflow completo), así que correrlo siempre es más
    # simple y más seguro que una lógica de detección de cambios propensa a
    # fallar. Es barato: lee 1 archivo, valida estructura.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar estructura del tracker de EF-3
        run: node scripts/validate-ef3-tracker.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          CI: true
        run: npm test

      - name: Check CSS layers (globals.css)
        run: npm run check-css-layers

      - name: Run lint
        # Auditoría externa 2026-09-09 (Fase 4.2): antes no bloqueaba el job aunque
        # lint tronara -- un error nuevo pasaba a main sin que nadie lo viera acá.
        # Hoy el lint real da 0 errores (solo warnings ya conocidos), así que
        # bloquear no rompe nada existente.
        run: npm run lint

      - name: Run build
        env:
          AUTH_SECRET: ci-build-secret
          AUTH_TRUST_HOST: 'true'
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run build
