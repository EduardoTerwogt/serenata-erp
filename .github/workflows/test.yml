name: Test Suite

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          CI: true
        run: npm test

      - name: Run lint
        # No bloquea el job: hay hallazgos conocidos y documentados (ver reporte
        # de cierre de Fase 1) que no cambian comportamiento — esto es visibilidad,
        # no gate. Un hallazgo NUEVO no aparece salvo que se revise el log manualmente.
        continue-on-error: true
        run: npm run lint

      - name: Run build
        env:
          AUTH_SECRET: ci-build-secret
          AUTH_TRUST_HOST: 'true'
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run build
