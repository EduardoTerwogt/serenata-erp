name: Test Suite

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          CI: true
        run: npm test

      - name: Check CSS layers (globals.css)
        run: npm run check-css-layers

      - name: Run lint
        # Auditoría externa 2026-09-09 (Fase 4.2): antes no bloqueaba el job aunque
        # lint tronara -- un error nuevo pasaba a main sin que nadie lo viera acá.
        # Hoy el lint real da 0 errores (solo warnings ya conocidos), así que
        # bloquear no rompe nada existente.
        run: npm run lint

      - name: Run build
        env:
          AUTH_SECRET: ci-build-secret
          AUTH_TRUST_HOST: 'true'
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run build
